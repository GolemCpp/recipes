# This cookbook is not a package. The file is here because black and ruff read
# their settings from it, and both should say the same as they do in golem.

[tool.black]
# Strings here are single-quoted, for now.
skip-string-normalization = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Width only, as in golem.
select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The long lines here are CMake statements written verbatim into a patch file.
# Splitting a string hides what is being written, and what is being written is
# the whole point of the recipe, therefore the width loses to the reader.
"@cinder@cinder/golemfile.py" = ["E501"]
