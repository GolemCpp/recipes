name: Tests

# A catalogue branch is checked against the Golem that reads it, so the install
# below is chosen by the branch a pull request targets rather than pinned:
# `v2` is what a released Golem fetches, `develop` is not released yet.
#
# The name is the interface. Branch protection speaks check names.
on:
  pull_request:
    branches: [v2, develop]

permissions:
  contents: read

jobs:
  catalogue:
    name: Catalogue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Golem
        env:
          # Read through the environment rather than interpolated into the
          # script: a branch name comes from the pull request, and `${{ }}` is
          # substituted as text before the shell ever sees it.
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

          if [ "$BASE_REF" = develop ]; then
            golem='golemcpp @ git+https://github.com/GolemCpp/golem.git@develop'
          else
            golem='golemcpp'
          fi

          # Phase 1 only: 1.3.0 is not on PyPI yet, therefore no released Golem
          # can read this branch's names and `v2` has no working answer above.
          # Delete this override once 1.3.0 is published.
          golem='golemcpp @ git+https://github.com/GolemCpp/golem.git@develop'

          python -m pip install "$golem"
      - name: Check every recipe is named what Golem looks it up by
        run: python -m pytest tests
      - name: Check the line width
        run: python -m ruff check
